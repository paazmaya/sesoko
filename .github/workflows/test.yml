name: Lightweight Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      - run: uv run --locked python src/crop_yolo.py --help
      - run: uv run --locked --extra detector-onnx --with onnx --with tomli-w pytest
